<!DOCTYPE html>
<!-- Cursor stats dashboard (renderer). IPC via preload: window.cursorWidget. See docs/ARCHITECTURE.md -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cursor stats</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("cursorStatsTheme");
          var t =
            s === "light" || s === "dark"
              ? s
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg-page: #f4f4f5;
        --bg-surface: #ffffff;
        --border: #e4e4e7;
        --text: #18181b;
        --text-muted: #71717a;
        --text-heading: #52525b;
        --text-footer: #a1a1aa;
        --row-divider: #f4f4f5;
        --th-bg: #fafafa;
        --code-bg: #f4f4f5;
        --btn-bg: #ffffff;
        --btn-border: #d4d4d8;
        --btn-primary-bg: #18181b;
        --btn-primary-fg: #fafafa;
        --chip-border: #e4e4e7;
        --chip-bg: #fafafa;
        --user-grad1: #e4e4e7;
        --user-grad2: #d4d4d8;
        --user-initial-fg: #3f3f46;
        --chart-bg: #ffffff;
        --chart-inner: #fafafa;
        --pie-canvas: #fafafa;
        --pie-bg: #f4f4f5;
        --pie-empty: #e4e4e7;
        --legend: #71717a;
        --link: #71717a;
        --row-latest-purple: rgba(139, 92, 246, 0.16);
        --row-latest-blue: rgba(37, 99, 235, 0.16);
        /** Stronger overlays for pricing usage meter (aligned to purple / blue chips) */
        --usage-meter-purple-strong: rgba(124, 58, 237, 0.58);
        --usage-meter-blue-strong: rgba(37, 99, 235, 0.58);
        --usage-meter-neutral-strong: rgba(71, 85, 105, 0.52);
        --warn-bg: #fef9c3;
        --warn-fg: #713f12;
        --warn-border: #fde047;
        --err-bg: #fee2e2;
        --err-fg: #991b1b;
        --err-border: #fecaca;
        --info-bg: #eff6ff;
        --info-fg: #1e3a8a;
        --info-border: #93c5fd;
        --info-link: #1d4ed8;
        --pie-cap: #3f3f46;
        --leg-pct: #52525b;
        --st-green-bg: #ecfdf5;
        --st-green-br: #6ee7b7;
        --st-green-fg: #14532d;
        --st-amber-bg: #fffbeb;
        --st-amber-br: #fbbf24;
        --st-amber-fg: #78350f;
        --st-red-bg: #fef2f2;
        --st-red-br: #f87171;
        --st-red-fg: #991b1b;
        --st-muted-bg: #fafafa;
        --st-muted-br: #e4e4e7;
        --st-muted-fg: #71717a;
        --sw-over-auto: rgba(249, 115, 22, 0.5);
        --sw-over-api: rgba(249, 115, 22, 0.5);
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --bg-page: #09090b;
        --bg-surface: #18181b;
        --border: #3f3f46;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --text-heading: #d4d4d8;
        --text-footer: #71717a;
        --row-divider: #27272a;
        --th-bg: #27272a;
        --code-bg: #27272a;
        --btn-bg: #27272a;
        --btn-border: #52525b;
        --btn-primary-bg: #e4e4e7;
        --btn-primary-fg: #18181b;
        --chip-border: #3f3f46;
        --chip-bg: #27272a;
        --user-grad1: #3f3f46;
        --user-grad2: #52525b;
        --user-initial-fg: #e4e4e7;
        --chart-bg: #18181b;
        --chart-inner: #27272a;
        --pie-canvas: #18181b;
        --pie-bg: #27272a;
        --pie-empty: #3f3f46;
        --legend: #a1a1aa;
        --link: #a1a1aa;
        --row-latest-purple: rgba(139, 92, 246, 0.3);
        --row-latest-blue: rgba(37, 99, 235, 0.3);
        --usage-meter-purple-strong: rgba(167, 139, 250, 0.62);
        --usage-meter-blue-strong: rgba(96, 165, 250, 0.62);
        --usage-meter-neutral-strong: rgba(148, 163, 184, 0.55);
        --warn-bg: #422006;
        --warn-fg: #fef08a;
        --warn-border: #a16207;
        --err-bg: #450a0a;
        --err-fg: #fecaca;
        --err-border: #991b1b;
        --info-bg: #172554;
        --info-fg: #bfdbfe;
        --info-border: #2563eb;
        --info-link: #93c5fd;
        --pie-cap: #d4d4d8;
        --leg-pct: #a1a1aa;
        --st-green-bg: #052e1a;
        --st-green-br: #166534;
        --st-green-fg: #bbf7d0;
        --st-amber-bg: #422006;
        --st-amber-br: #a16207;
        --st-amber-fg: #fde68a;
        --st-red-bg: #450a0a;
        --st-red-br: #b91c1c;
        --st-red-fg: #fecaca;
        --st-muted-bg: #27272a;
        --st-muted-br: #3f3f46;
        --st-muted-fg: #a1a1aa;
        --sw-over-auto: rgba(251, 146, 60, 0.5);
        --sw-over-api: rgba(251, 146, 60, 0.5);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        line-height: 1.3;
        background: var(--bg-page);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
      }
      .hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 5px 8px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .hdr-title-block {
        min-width: 0;
        flex: 1;
      }
      .hdr h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .hdr-user-name {
        margin: 1px 0 0;
        font-size: 10px;
        font-weight: 500;
        line-height: 1.2;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hdr-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .auth-wrap {
        display: flex;
        align-items: center;
        min-width: 28px;
        justify-content: center;
      }
      .user-chip {
        position: relative;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid var(--chip-border);
        background: var(--chip-bg);
        overflow: hidden;
        flex-shrink: 0;
      }
      .user-avatar {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .user-avatar-fallback {
        position: absolute;
        inset: 0;
        z-index: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--user-initial-fg);
        background: linear-gradient(135deg, var(--user-grad1), var(--user-grad2));
      }
      button {
        font: inherit;
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 6px;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--text);
        cursor: pointer;
      }
      button.btn-theme {
        font-size: 14px;
        line-height: 1;
        padding: 2px 4px;
        min-width: auto;
        background: transparent;
        border: none;
        color: var(--text-muted);
      }
      button.btn-theme:hover {
        color: var(--text-heading);
      }
      button.primary {
        background: var(--btn-primary-bg);
        color: var(--btn-primary-fg);
        border-color: var(--btn-primary-bg);
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #main-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 4px 8px 3px;
        overflow: hidden;
      }
      .view-panel {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow: hidden;
      }
      .view-panel[hidden] {
        display: none;
      }
      .hint {
        margin: 0 0 3px;
        font-size: 9px;
        color: var(--text-muted);
        line-height: 1.25;
      }
      .chart-wrap {
        background: var(--chart-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 6px 2px;
        flex: 0 0 auto;
      }
      .chart-wrap__head {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 4px 10px;
        margin-bottom: 2px;
      }
      .chart-wrap__head h2,
      .section-tight h2 {
        margin: 0 0 2px;
        font-size: 9px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-heading);
      }
      .chart-wrap__head h2 {
        margin: 0;
        flex: 0 1 auto;
      }
      .chart-wrap__meta {
        font-size: 8px;
        line-height: 1.3;
        color: var(--text-muted);
        text-align: right;
        flex: 0 1 auto;
        min-width: 0;
        max-width: 60%;
      }
      .chart-wrap__meta .chart-meta-line {
        display: flex;
        justify-content: flex-end;
        gap: 4px 8px;
        flex-wrap: wrap;
        font-size: inherit;
        line-height: inherit;
      }
      .chart-wrap__meta .chart-meta-line + .chart-meta-line {
        margin-top: 2px;
      }
      .chart-wrap__meta .chart-meta-line strong {
        color: var(--text-heading);
        font-weight: 650;
      }
      #usage-chart {
        display: block;
        width: 100%;
        height: 100px;
        border-radius: 4px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 8px;
        color: var(--legend);
        margin-top: 2px;
        padding: 0 1px 2px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }
      .sw {
        width: 12px;
        height: 3px;
        border-radius: 1px;
        flex-shrink: 0;
      }
      .sw.allow {
        background: repeating-linear-gradient(90deg, #2563eb 0 4px, transparent 4px 8px);
        height: 2px;
      }
      .sw.auto {
        background: #8b5cf6;
      }
      .sw.api {
        background: #2563eb;
      }
      .sw.over-auto {
        background: var(--sw-over-auto);
        height: 8px;
        border-radius: 2px;
      }
      .sw.over-api {
        background: var(--sw-over-api);
        height: 8px;
        border-radius: 2px;
      }
      .section-tight {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 4px 6px;
        flex: 0 0 auto;
      }
      .section-tight--pies {
        flex: 0 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .section-flex {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        padding: 2px 0;
        border-bottom: 1px solid var(--row-divider);
        font-size: 10px;
      }
      .row:last-child {
        border-bottom: none;
      }
      .muted {
        color: var(--text-muted);
      }
      .banner {
        padding: 4px 6px;
        border-radius: 5px;
        font-size: 10px;
        margin-bottom: 4px;
        flex-shrink: 0;
      }
      .banner.warn {
        background: var(--warn-bg);
        color: var(--warn-fg);
        border: 1px solid var(--warn-border);
      }
      .banner.err {
        background: var(--err-bg);
        color: var(--err-fg);
        border: 1px solid var(--err-border);
      }
      .banner.info {
        background: var(--info-bg);
        color: var(--info-fg);
        border: 1px solid var(--info-border);
      }
      .banner.info a {
        color: var(--info-link);
        font-weight: 600;
        margin-left: 4px;
      }
      .table-wrap {
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
        flex: 1;
        min-height: 0;
      }
      .table-wrap--pricing {
        max-height: none;
      }
      #pricing-section .table-wrap {
        font-size: 9px;
      }
      tr.row-latest-purple td {
        background: var(--row-latest-purple);
      }
      tr.row-latest-blue td {
        background: var(--row-latest-blue);
      }
      /** Usage column only: fraction of table spend; hues match Composer purple / API-ish blue / slate */
      #models-table tbody tr.pricing-row--meter > td:last-child {
        background-image: linear-gradient(
            to right,
            var(--usage-meter-strong) var(--usage-meter-pct, 0%),
            transparent var(--usage-meter-pct, 0%)
          ),
          linear-gradient(
            var(--usage-meter-soft, transparent),
            var(--usage-meter-soft, transparent)
          );
      }
      th.th-sort {
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      th.th-sort:hover {
        color: var(--text);
      }
      th.th-sort:focus-visible {
        outline: 2px solid var(--btn-primary-bg);
        outline-offset: 1px;
      }
      th.th-sort--active.th-sort--asc::after {
        content: " ▲";
        font-size: 7px;
        opacity: 0.75;
        font-weight: 700;
      }
      th.th-sort--active.th-sort--desc::after {
        content: " ▼";
        font-size: 7px;
        opacity: 0.75;
        font-weight: 700;
      }
      th.th-sort--active.th-sort--newest::after {
        content: " ◆";
        font-size: 7px;
        opacity: 0.75;
        font-weight: 700;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 9px;
      }
      th,
      td {
        text-align: left;
        padding: 2px 4px;
        border-bottom: 1px solid var(--row-divider);
        vertical-align: top;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--th-bg);
        font-weight: 600;
        color: var(--text-heading);
        z-index: 1;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .num {
        text-align: right;
        white-space: nowrap;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 3px 4px 4px 8px;
        font-size: 8px;
        color: var(--text-footer);
        border-top: 1px solid var(--border);
        background: var(--bg-surface);
        flex-shrink: 0;
      }
      .footer-credit {
        white-space: nowrap;
      }
      .footer-fontana {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .footer-fontana .footer-fontana-mark {
        display: block;
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        object-fit: contain;
      }
      footer a {
        color: var(--link);
      }
      .pie-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto 80px auto auto;
        column-gap: 6px;
        row-gap: 0;
        margin-top: 2px;
        min-height: 0;
      }
      .pie-cell {
        display: grid;
        grid-template-rows: subgrid;
        grid-row: 1 / span 4;
        min-width: 0;
      }
      .pie-cell:first-of-type {
        grid-column: 1;
      }
      .pie-cell:last-of-type {
        grid-column: 2;
      }
      .on-demand-below-pies {
        margin-top: 6px;
      }
      .pie-cap {
        font-size: 9px;
        font-weight: 600;
        color: var(--pie-cap);
        margin-bottom: 1px;
      }
      .pie-canvas {
        display: block;
        width: 100%;
        height: 80px;
        border-radius: 4px;
        background: var(--pie-canvas);
      }
      .pie-leg {
        margin-top: 2px;
        font-size: 8px;
        line-height: 1.3;
        max-height: 132px;
        overflow: auto;
      }
      .leg-row {
        display: grid;
        grid-template-columns: 7px minmax(0, 1fr) auto minmax(0, auto);
        align-items: center;
        gap: 2px 4px;
        margin-bottom: 2px;
      }
      .leg-row .dot {
        width: 6px;
        height: 6px;
        border-radius: 2px;
        flex-shrink: 0;
        grid-column: 1;
      }
      .leg-row .name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        grid-column: 2;
      }
      .leg-row .leg-tok {
        color: var(--text-footer);
        font-size: 7px;
        white-space: nowrap;
        text-align: right;
        max-width: 64px;
        overflow: hidden;
        text-overflow: ellipsis;
        grid-column: 3;
      }
      .leg-row .pct {
        color: var(--leg-pct);
        font-weight: 600;
        white-space: nowrap;
        grid-column: 4;
      }
      .pie-status {
        margin-top: 3px;
        padding: 4px 5px;
        border-radius: 4px;
        font-size: 8px;
        line-height: 1.3;
        border: 1px solid transparent;
        min-height: 0;
        align-self: stretch;
        display: grid;
        align-content: center;
        box-sizing: border-box;
      }
      .pie-status strong {
        font-weight: 650;
        font-size: 8px;
        letter-spacing: 0.01em;
      }
      .pie-status--green {
        background: var(--st-green-bg);
        border-color: var(--st-green-br);
        color: var(--st-green-fg);
      }
      .pie-status--amber {
        background: var(--st-amber-bg);
        border-color: var(--st-amber-br);
        color: var(--st-amber-fg);
      }
      .pie-status--red {
        background: var(--st-red-bg);
        border-color: var(--st-red-br);
        color: var(--st-red-fg);
      }
      .pie-status--muted {
        background: var(--st-muted-bg);
        border-color: var(--st-muted-br);
        color: var(--st-muted-fg);
      }
      code {
        font-size: 9px;
        background: var(--code-bg);
        padding: 0 2px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <header class="hdr">
      <div class="hdr-title-block">
        <h1>Cursor stats</h1>
        <p id="hdr-user-name" class="hdr-user-name" hidden></p>
      </div>
      <div class="hdr-actions">
        <button type="button" class="btn-theme" id="btn-theme" title="Theme" aria-label="Toggle color theme">
          &#9728;
        </button>
        <div class="auth-wrap" id="auth-wrap">
          <button type="button" class="primary" id="btn-signin">Sign in…</button>
          <div id="user-chip" class="user-chip" hidden>
            <div id="user-avatar-fallback" class="user-avatar-fallback" hidden>?</div>
            <img
              id="user-avatar"
              class="user-avatar"
              alt=""
              width="28"
              height="28"
              loading="lazy"
              referrerpolicy="no-referrer"
            />
          </div>
        </div>
      </div>
    </header>
    <main id="main-body">
      <div id="banner" class="banner" hidden></div>
      <div id="banner-update" class="banner info" hidden role="status" aria-live="polite"></div>
      <div id="view-usage" class="view-panel">
        <div class="chart-wrap">
          <div class="chart-wrap__head">
            <h2>Month vs allowance pace</h2>
            <div class="chart-wrap__meta" id="chart-usage-meta" role="status" aria-live="polite"></div>
          </div>
          <canvas id="usage-chart" width="320" height="100"></canvas>
          <div class="legend">
            <span><i class="sw allow"></i> Allowance</span>
            <span><i class="sw auto"></i> Auto + Composer</span>
            <span><i class="sw api"></i> API</span>
            <span><i class="sw over-auto"></i> Auto over 100%</span>
            <span><i class="sw over-api"></i> API over 100%</span>
          </div>
        </div>
        <section class="section-tight section-tight--pies" id="breakdown-section">
          <h2>Usage breakdown</h2>
          <div class="pie-grid">
            <div class="pie-cell">
              <div class="pie-cap">Auto + Composer</div>
              <canvas class="pie-canvas" id="pie-auto"></canvas>
              <div id="pie-auto-leg" class="pie-leg"></div>
              <div id="pie-auto-status" class="pie-status pie-status--muted" hidden aria-live="polite"></div>
            </div>
            <div class="pie-cell">
              <div class="pie-cap">API pool</div>
              <canvas class="pie-canvas" id="pie-api"></canvas>
              <div id="pie-api-leg" class="pie-leg"></div>
              <div id="pie-api-status" class="pie-status pie-status--muted" hidden aria-live="polite"></div>
            </div>
          </div>
          <div
            id="on-demand-period-box"
            class="pie-status pie-status--muted on-demand-below-pies"
            hidden
            role="status"
            aria-live="polite"
          ></div>
        </section>
        <section class="section-tight section-flex" id="pricing-section">
          <h2>Models ($/1M tok) <span class="muted" style="font-weight: normal; font-size: 0.85em">— Usage = this cycle</span></h2>
          <p id="pricing-status" class="muted hint" style="margin-top: 0" hidden></p>
          <div class="table-wrap table-wrap--pricing">
            <table id="models-table">
              <thead>
                <tr>
                  <th class="th-sort" scope="col" data-sort="model" role="columnheader" tabindex="0">Model</th>
                  <th class="th-sort num" scope="col" data-sort="in" role="columnheader" tabindex="0">In</th>
                  <th class="th-sort num" scope="col" data-sort="out" role="columnheader" tabindex="0">Out</th>
                  <th
                    class="th-sort num"
                    scope="col"
                    data-sort="usage"
                    role="columnheader"
                    tabindex="0"
                    title="Spend this cycle from dashboard aggregations; modelIntent matched to each model name"
                  >
                    Usage ($)
                  </th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>

        </section>

    <footer>
      <span>
        <a href="#" id="link-spending">Spending</a>
        ·
        <a href="#" id="link-docs">Models &amp; pricing</a>
      </span>
      <a
        class="footer-credit footer-fontana"
        href="https://fontana-ai.com"
        id="link-fontana"
        title="Fontana"
      >
        <span>Made by Fontana Labs</span>
        <img

          alt=""
