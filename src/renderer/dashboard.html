      </a>
    </footer>
    <script>
      (() => {
        const cw = window.cursorWidget;
        if (!cw) {
          document.body.innerHTML = '<p style="padding:16px">Preload not available.</p>';
          return;
        }

        const SPENDING_URL = "https://cursor.com/dashboard/spending";
        const DOCS_URL = "https://cursor.com/docs/models-and-pricing#model-pricing";
        const FONTANA_URL = "https://fontana-ai.com";

        /** Drop shadow for pie donut center % — same in both themes; fill is theme-specific. */
        const PIE_CENTER_SHADOW = {
          color: "rgba(0,0,0,0.5)",
          blur: 3,
          offsetY: 1,
        };

        const banner = document.getElementById("banner");
        const bannerUpdate = document.getElementById("banner-update");
        const chartUsageMeta = document.getElementById("chart-usage-meta");
        const pricingStatus = document.getElementById("pricing-status");
        const modelsTable = document.getElementById("models-table");
        const modelsTbody = modelsTable ? modelsTable.querySelector("tbody") : null;
        let pricingSortKey = null;
        let pricingSortDir = 1;
        /** 0 = A→Z, 1 = Z→A, 2 = newest (highlighted first, then by version). Only when `pricingSortKey === "model"`. */
        let pricingModelCycle = 0;
        let lastPricingPayload = null;
        /** From `getChartPayload()` — per-row spend from get-aggregated-usage-events. */
        let lastAggregatedUsage = null;
        const btnSignin = document.getElementById("btn-signin");
        const pieAutoStatus = document.getElementById("pie-auto-status");
        const pieApiStatus = document.getElementById("pie-api-status");
        const linkSpending = document.getElementById("link-spending");
        const linkDocs = document.getElementById("link-docs");
        const linkFontana = document.getElementById("link-fontana");
        const chartCanvas = document.getElementById("usage-chart");
        const pieAuto = document.getElementById("pie-auto");
        const pieApi = document.getElementById("pie-api");
        const pieAutoLeg = document.getElementById("pie-auto-leg");
        const pieApiLeg = document.getElementById("pie-api-leg");
        const userChip = document.getElementById("user-chip");
        const userAvatar = document.getElementById("user-avatar");
        const userAvatarFallback = document.getElementById("user-avatar-fallback");
        const hdrUserName = document.getElementById("hdr-user-name");
        const btnTheme = document.getElementById("btn-theme");
        const onDemandPeriodBox = document.getElementById("on-demand-period-box");

        const PIE_AUTO_COLORS = [
          "#7c3aed",
          "#a78bfa",
          "#c4b5fd",
          "#8b5cf6",
          "#6d28d9",
          "#5b21b6",
          "#4c1d95",
          "#a855f7",
          "#7e22ce",
          "#6b21a8",
          "#9d74f2",
        ];
        const PIE_API_COLORS = [
          "#2563eb",
          "#60a5fa",
          "#93c5fd",
          "#1d4ed8",
          "#3b82f6",
          "#1e40af",
          "#0ea5e9",
          "#38bdf8",
          "#0c4a6e",
          "#0284c7",
          "#0369a1",
        ];
        const THEME_KEY = "cursorStatsTheme";

        let currentSession = null;
        let lastStatsRef = null;
        let lastAvatarKey = null;
        let userTheme = null;
        try {
          const st = localStorage.getItem(THEME_KEY);
          if (st === "light" || st === "dark") userTheme = st;
        } catch (e) {}

        function isDarkMode() {
          return document.documentElement.getAttribute("data-theme") === "dark";
        }

        function chartTheme() {
          if (isDarkMode()) {
            return {
              plotBg: "#27272a",
              grid: "#3f3f46",
              axis: "#71717a",
              label: "#a1a1aa",
              emptyHint: "#a1a1aa",
              pieFill: "#27272a",
              pieEmpty: "#3f3f46",
              sliceEdge: "rgba(0,0,0,0.5)",
              pieCenterText: "#d4d4d8",
              autoOverageBand: "rgba(251, 146, 60, 0.5)",
              apiOverageBand: "rgba(251, 146, 60, 0.5)",
            };
          }
          return {
            plotBg: "#fafafa",
            grid: "#e4e4e7",
            axis: "#a1a1aa",
            label: "#52525b",
            emptyHint: "#71717a",
            pieFill: "#f4f4f5",
            pieEmpty: "#e4e4e7",
            sliceEdge: "rgba(255,255,255,0.85)",
            pieCenterText: "#ffffff",
            autoOverageBand: "rgba(249, 115, 22, 0.5)",
            apiOverageBand: "rgba(249, 115, 22, 0.5)",
          };
        }

        function syncThemeButton() {
          if (!btnTheme) return;
          const d = isDarkMode();
          btnTheme.textContent = d ? "\u2600" : "\u263E";
          btnTheme.setAttribute("title", d ? "Light mode" : "Dark mode");
          btnTheme.setAttribute("aria-label", d ? "Switch to light mode" : "Switch to dark mode");
        }

        function applyTheme(shouldRedraw) {
          if (userTheme === "light" || userTheme === "dark") {
            document.documentElement.setAttribute("data-theme", userTheme);
          } else {
            document.documentElement.setAttribute(
              "data-theme",
              window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
            );
          }
          syncThemeButton();
          if (shouldRedraw) {
            cw.getChartData().then(applyFullDashboard);
          }
        }

        function toggleTheme() {
          userTheme = isDarkMode() ? "light" : "dark";
          try {
            localStorage.setItem(THEME_KEY, userTheme);
          } catch (e) {}
          applyTheme(true);
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        /** e.g. 17th Jun (locale month abbreviation). */
        function formatOrdinalDayMonth(d) {
          if (!(d instanceof Date) || Number.isNaN(d.getTime())) return "";
          const day = d.getDate();
          const mod100 = day % 100;
          const mod10 = day % 10;
          var suf = "th";
          if (mod100 < 11 || mod100 > 13) {
            if (mod10 === 1) suf = "st";
            else if (mod10 === 2) suf = "nd";
            else if (mod10 === 3) suf = "rd";
          }
          const month = d.toLocaleDateString(undefined, { month: "short" });
          return day + suf + " " + month;
        }

        function billingElapsedDays(billing) {
          const D = Math.max(1, billing && billing.daysTotal ? billing.daysTotal : 1);
          const start = new Date(
            billing && billing.periodStart != null
              ? billing.periodStart
              : billing && billing.periodStartKey
                ? billing.periodStartKey + "T00:00:00"
                : Date.now(),
          );
          if (Number.isNaN(start.getTime())) {
            return Math.max(0.001, Math.min(D, billing && billing.currentDayIndex ? billing.currentDayIndex : 0));
          }
          return Math.max(0.001, Math.min(D, (Date.now() - start.getTime()) / 86400000));
        }

        function setBanner(type, text) {
          if (!text) {
            banner.hidden = true;
            banner.textContent = "";
            banner.className = "banner";
            return;
          }
          banner.hidden = false;
          banner.textContent = text;
          banner.className = "banner " + type;
        }

        function hideUpdateBanner() {
          if (!bannerUpdate) return;
          bannerUpdate.hidden = true;
          bannerUpdate.innerHTML = "";
        }

        function showUpdateBanner(latestVersion, releaseUrl) {
          if (!bannerUpdate || cw.openExternal == null) return;
          bannerUpdate.hidden = false;
          bannerUpdate.innerHTML = "";
          var msg = document.createElement("span");
          msg.textContent = "A new version is available (" + String(latestVersion) + ").";
          bannerUpdate.appendChild(msg);
          var a = document.createElement("a");
          a.href = "#";
          a.textContent = "Download";
          a.addEventListener("click", function (e) {
            e.preventDefault();
            cw.openExternal(releaseUrl);
          });
          bannerUpdate.appendChild(a);
        }

        function maybeFetchAppUpdate() {
          if (typeof cw.checkAppUpdate !== "function") return;
          cw.checkAppUpdate()
            .then(function (r) {
              if (r && r.updateAvailable === true && r.releaseUrl && r.latestVersion != null && r.latestVersion !== "") {
                showUpdateBanner(r.latestVersion, r.releaseUrl);
              } else {
                hideUpdateBanner();
              }
            })
            .catch(function () {
              hideUpdateBanner();
            });
        }

        function fmtMoney(n) {
          if (n == null || Number.isNaN(n)) return "—";
          return n.toLocaleString(undefined, { style: "currency", currency: "USD" });
        }

        function updateHeaderUserName(session) {
          if (!hdrUserName) return;
          const me = session && session.me;
          const u = me && me.ok && me.user ? me.user : null;
          const name = u && u.name && String(u.name).trim();
          if (name) {
            hdrUserName.hidden = false;
            hdrUserName.textContent = name;
          } else {
            hdrUserName.hidden = true;
            hdrUserName.textContent = "";
          }
        }

        function absolutizeCursorAssetUrl(url) {
          if (!url || typeof url !== "string") return null;
          const s = url.trim();
          if (!s) return null;
          if (/^https?:\/\//i.test(s)) return s;
          if (s.startsWith("//")) return "https:" + s;
          if (s.startsWith("/")) return "https://cursor.com" + s;
          return s;
        }

        /** Match cursor-session isLikelyProfileImageUrl (WorkOS CDN has no file extension). */
        function isLikelyProfileImageUrl(s) {
          if (typeof s !== "string") return false;
          const t = s.trim();
          if (t.length < 8 || t.length > 2000) return false;
          if (!/^https?:\/\//i.test(t) && !t.startsWith("/")) return false;
          if (/workoscdn\.com/i.test(t)) return true;
          if (/images\/v\d+\/[\w-]+/i.test(t)) return true;
          if (/\.(png|jpe?g|webp|gif|svg)(\?|$)/i.test(t)) return true;
          if (/(gravatar|githubusercontent|googleusercontent|cloudinary|avatar)/i.test(t)) return true;
          return false;
        }

        function extractPictureFromRawJson(obj, depth) {
          if (depth == null) depth = 0;
          if (depth > 8 || obj == null) return null;
          if (typeof obj === "string") {
            const s = obj.trim();
            if (s.length < 8) return null;
            if (!/^https?:\/\//i.test(s) && !s.startsWith("/")) return null;
            if (isLikelyProfileImageUrl(s)) return s;
            return null;
          }
          if (Array.isArray(obj)) {
            for (const v of obj) {
              const f = extractPictureFromRawJson(v, depth + 1);
              if (f) return f;
            }
            return null;
          }
          if (typeof obj === "object") {
            for (const [k, v] of Object.entries(obj)) {
              const kl = k.toLowerCase();
              if (
                typeof v === "string" &&
                (kl.includes("avatar") ||
                  kl.includes("photo") ||
                  kl.includes("picture") ||
                  kl === "image" ||
                  kl === "imageurl" ||
                  kl.endsWith("url")) &&
                v.length < 2000
              ) {
                const t = v.trim();
                if (/^https?:\/\//i.test(t) || t.startsWith("/")) return t;
              }
            }
            for (const v of Object.values(obj)) {
              const f = extractPictureFromRawJson(v, depth + 1);
              if (f) return f;
            }
          }
          return null;
        }

        function updateHeaderAuth() {
          const session = currentSession;
          const me = session && session.me;
          const u = me && me.ok && me.user ? me.user : null;
          const stats = lastStatsRef;
          const signedInApi = !!(me && me.ok);
          const signedInPage = stats && stats.loggedIn === true;
          const showSigned = signedInApi || signedInPage;

          if (!showSigned) {
            btnSignin.hidden = false;
            userChip.hidden = true;
            lastAvatarKey = null;
            userAvatar.removeAttribute("src");
            if (userAvatarFallback) {
              userAvatarFallback.hidden = true;
              userAvatarFallback.textContent = "?";
            }
            return;
          }

          btnSignin.hidden = true;
          userChip.hidden = false;

          const labelParts = [];
          if (u) {
            if (u.name) labelParts.push(u.name);
            if (u.email) labelParts.push(u.email);
            if (u.plan) labelParts.push(String(u.plan));
          } else if (stats && (stats.resetLabel || stats.note)) {
            if (stats.resetLabel) labelParts.push("Billing: " + stats.resetLabel);
          } else {
            labelParts.push("Signed in");
          }
          userChip.title = labelParts.length ? labelParts.join(" · ") : "Signed in";

          let pic =
            u && u.picture
              ? absolutizeCursorAssetUrl(u.picture)
              : me && me.ok && me.raw
                ? absolutizeCursorAssetUrl(extractPictureFromRawJson(me.raw))
                : null;
          if (!pic && session && session.accountAvatarUrl) {
            pic = absolutizeCursorAssetUrl(session.accountAvatarUrl);
          }
          const key = u
            ? (u.id != null ? String(u.id) : "") + "\0" + (pic || u.email || u.name || "")
            : (pic || "page") + "\0" + (stats && stats.loggedIn);

          if (pic) {
            if (lastAvatarKey !== key) {
              lastAvatarKey = key;
              if (userAvatarFallback) userAvatarFallback.hidden = true;
              userAvatar.hidden = false;
              userAvatar.onerror = function () {
                userAvatar.hidden = true;
                if (userAvatarFallback) {
                  userAvatarFallback.hidden = false;
                  const base = (u && (u.email || u.name)) || "?";
                  userAvatarFallback.textContent = String(base).charAt(0).toUpperCase();
                }
              };
              userAvatar.onload = function () {
                userAvatar.hidden = false;
                if (userAvatarFallback) userAvatarFallback.hidden = true;
              };
              userAvatar.src = pic;
            }
          } else if (u) {
            lastAvatarKey = key;
            userAvatar.removeAttribute("src");
            userAvatar.hidden = true;
            if (userAvatarFallback) {
              userAvatarFallback.hidden = false;
              const c = (u.email || u.name || "?").charAt(0).toUpperCase();
              userAvatarFallback.textContent = c;
            }
          } else {
            lastAvatarKey = key;
            userAvatar.removeAttribute("src");
            userAvatar.hidden = true;
            if (userAvatarFallback) {
              userAvatarFallback.hidden = false;
              userAvatarFallback.textContent = "✓";
            }
          }
        }

        function remainingPctForPieCenter(slices, poolPercent) {
          if (poolPercent != null && Number.isFinite(Number(poolPercent))) {
            const u = Number(poolPercent);
            return Math.max(0, Math.min(100, Math.round(100 - u)));
          }
          if (!slices || !slices.length) return null;
          for (let i = 0; i < slices.length; i++) {
            if (/remaining/i.test(String(slices[i].label || ""))) {
              return Math.max(0, Math.min(100, Math.round(Math.max(0, slices[i].value) * 100)));
            }
          }
          return null;
        }

        function drawPieCenterRemaining(ctx, cx, cy, pct) {
          if (pct == null || !Number.isFinite(pct)) return;
          const ct = chartTheme();
          const label = String(Math.round(pct)) + "%";
          const dim = Math.min(ctx.canvas.width, ctx.canvas.height) / (window.devicePixelRatio || 1);
          const fontSize = Math.min(20, Math.max(13, Math.floor(dim * 0.26)));
          ctx.save();
          ctx.font = "650 " + fontSize + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.shadowColor = PIE_CENTER_SHADOW.color;
          ctx.shadowBlur = PIE_CENTER_SHADOW.blur;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = PIE_CENTER_SHADOW.offsetY;
          ctx.fillStyle = ct.pieCenterText;
          ctx.fillText(label, cx, cy);
          ctx.restore();
        }

        function drawPieCanvas(canvas, slices, palette, centerRemainingPct) {
          if (!canvas) return;
          const ct = chartTheme();
          const ctx = canvas.getContext("2d");
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();
          const w = Math.max(100, Math.floor(rect.width));
          const h = 80;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = ct.pieFill;
          ctx.fillRect(0, 0, w, h);
          const cx = w / 2;
          const cy = h / 2 - 2;
          const r = Math.min(w, h) * 0.35;
          if (!slices || slices.length === 0) {
            ctx.fillStyle = ct.pieEmpty;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            drawPieCenterRemaining(ctx, cx, cy, centerRemainingPct);
            return;
          }
          let a0 = -Math.PI / 2;
          for (let i = 0; i < slices.length; i++) {
            const seg = Math.max(0, slices[i].value) * Math.PI * 2;
            if (seg <= 0) continue;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, a0, a0 + seg);
            ctx.closePath();
            ctx.fillStyle = palette[i % palette.length];
            ctx.fill();
            a0 += seg;
          }
          ctx.strokeStyle = ct.sliceEdge;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
          drawPieCenterRemaining(ctx, cx, cy, centerRemainingPct);
        }

        function formatPiePct(frac) {
          const p = (frac != null && Number.isFinite(frac) ? frac : 0) * 100;
          if (p >= 10) return "" + Math.round(p) + "%";
          if (p >= 1) return p.toFixed(1) + "%";
          if (p >= 0.1) return p.toFixed(1) + "%";
          if (p > 0) return "<0.1%";
          return "0%";
        }

        function renderPieLegend(el, slices, palette) {
          if (!slices || !slices.length) {
            el.innerHTML = '<p class="muted" style="margin:0;font-size:8px">—</p>';
            return;
          }
          el.innerHTML = slices
            .map(function (s, i) {
              const tok =
                s.tokensText != null && String(s.tokensText).trim() !== ""
                  ? '<span class="leg-tok" title="' +
                    escapeHtml(String(s.tokensText)) +
                    '">' +
                    escapeHtml(String(s.tokensText)) +
                    "</span>"
                  : '<span class="leg-tok" aria-hidden="true"></span>';
              return (
                '<div class="leg-row" title="' +
                escapeHtml(s.label) +
                (s.tokensText != null
                  ? " · " + escapeHtml(String(s.tokensText))
                  : "") +
                '"><span class="dot" style="background:' +
                palette[i % palette.length] +
                '"></span><span class="name">' +
                escapeHtml(s.label) +
                "</span>" +
                tok +
                '<span class="pct">' +
                formatPiePct(s.value) +
                "</span></div>"
              );
            })
            .join("");
        }

        function renderOnDemandPeriodBox(session) {
          if (!onDemandPeriodBox) return;
          const u = session && session.currentPeriodUsage;
          if (u && u.ok && u.amountUsd != null && u.amountUsd > 0) {
            onDemandPeriodBox.hidden = false;
            const L = "<strong>On-demand:</strong> ";
            const usedStr = fmtMoney(u.amountUsd);
            const cap =
              u.limitUsd != null && Number.isFinite(u.limitUsd) ? u.limitUsd : null;
            const rem =
              u.remainingUsd != null && Number.isFinite(u.remainingUsd) ? u.remainingUsd : null;
            let body = usedStr + " used";
            if (cap != null) {
              body += " · " + fmtMoney(cap) + " cap";
              if (rem != null) {
                if (rem >= 0) {
                  body += " · " + fmtMoney(rem) + " available";
                } else {
                  body += " · " + fmtMoney(-rem) + " over cap";
                }
              }
            }
            let stClass = "pie-status--green";
            if (rem != null && rem < 0) {
              stClass = "pie-status--red";
            } else if (cap != null && rem != null && rem >= 0) {
              const r = cap > 0 ? rem / cap : 1;
              if (rem === 0 || r < 0.1) {
                stClass = "pie-status--amber";
              }
            }
            onDemandPeriodBox.className = "pie-status " + stClass + " on-demand-below-pies";
            onDemandPeriodBox.innerHTML = L + body;
          } else {
            onDemandPeriodBox.hidden = true;
            onDemandPeriodBox.innerHTML = "";
            onDemandPeriodBox.className = "pie-status pie-status--muted on-demand-below-pies";
          }
        }

        function renderSession(session, statsForPies) {
          const st = statsForPies != null ? statsForPies : lastStatsRef;
          if (!session) {
            updateHeaderUserName(null);
            drawPieCanvas(pieAuto, [], PIE_AUTO_COLORS, remainingPctForPieCenter(null, st && st.autoPercent));
            drawPieCanvas(pieApi, [], PIE_API_COLORS, remainingPctForPieCenter(null, st && st.apiPercent));
            pieAutoLeg.innerHTML = "";
            pieApiLeg.innerHTML = "";
            renderOnDemandPeriodBox(null);
            return;
          }

          const pies = session.billingPies;
          if (pies && pies.auto && pies.auto.length) {
            drawPieCanvas(
              pieAuto,
              pies.auto,
              PIE_AUTO_COLORS,
              remainingPctForPieCenter(pies.auto, st && st.autoPercent),
            );
            renderPieLegend(pieAutoLeg, pies.auto, PIE_AUTO_COLORS);
          } else {
            drawPieCanvas(pieAuto, [], PIE_AUTO_COLORS, remainingPctForPieCenter(null, st && st.autoPercent));
            pieAutoLeg.innerHTML =
              '<p class="muted" style="margin:0;font-size:8px">No Auto/Composer data.</p>';
          }

          if (pies && pies.api && pies.api.length) {
            drawPieCanvas(
              pieApi,
              pies.api,
              PIE_API_COLORS,
              remainingPctForPieCenter(pies.api, st && st.apiPercent),
            );
            renderPieLegend(pieApiLeg, pies.api, PIE_API_COLORS);
          } else {
            drawPieCanvas(pieApi, [], PIE_API_COLORS, remainingPctForPieCenter(null, st && st.apiPercent));
            pieApiLeg.innerHTML = '<p class="muted" style="margin:0;font-size:8px">No API data.</p>';
          }

          renderOnDemandPeriodBox(session);
        }

        function applyFullDashboard(payload) {
          try {
            if (payload) {
              currentSession = payload.session;
            }
            lastAggregatedUsage = payload && payload.aggregatedUsage;
            updateHeaderUserName(payload && payload.session);
            redrawChart(payload || {});
            renderSession(payload && payload.session, payload && payload.stats);
            updateHeaderAuth();
            if (lastPricingPayload && lastPricingPayload.ok && lastPricingPayload.data) {
              paintPricingTable(lastPricingPayload.data, lastAggregatedUsage);
            }
          } catch (e) {
            console.error("cursor stats dashboard:", e);
          }
        }

        function clearPaceStatusBoxes() {
          if (!pieAutoStatus || !pieApiStatus) return;
          pieAutoStatus.innerHTML = "";
          pieApiStatus.innerHTML = "";
          pieAutoStatus.hidden = true;
          pieApiStatus.hidden = true;
          pieAutoStatus.className = "pie-status pie-status--muted";
          pieApiStatus.className = "pie-status pie-status--muted";
        }

        function updateChartInsights(payload) {
          if (!pieAutoStatus || !pieApiStatus) return;

          const billing = payload && payload.billing;
          const stats = payload && payload.stats;
          if (!billing || !stats || stats.loggedIn === false) {
            clearPaceStatusBoxes();
            return;
          }
          if (stats.ok === false) {
            clearPaceStatusBoxes();
            return;
          }

          const D = Math.max(1, billing.daysTotal);
          const elapsedDays = billingElapsedDays(billing);
          const pace = (elapsedDays / D) * 100;
          const periodEnd = new Date(
            billing.periodEnd != null
              ? typeof billing.periodEnd === "string"
                ? billing.periodEnd
                : billing.periodEnd
              : billing.periodEndKey + "T12:00:00",
          );
          const endOk = !Number.isNaN(periodEnd.getTime());

          function runoutLine(usagePct) {
            if (usagePct == null) return null;
            if (usagePct >= 100) {
              return "at or over 100% of this pool — the allowance is exhausted until reset.";
            }
            if (usagePct < pace) return null;
            const rate = usagePct / elapsedDays;
            if (rate < 0.01) return null;
            const daysToFull = (100 - usagePct) / rate;
            if (!Number.isFinite(daysToFull) || daysToFull < 0 || daysToFull > 400) return null;
            const when = new Date();
            when.setDate(when.getDate() + Math.ceil(daysToFull));
            const ord = formatOrdinalDayMonth(when);
            if (!ord) return null;
            var resetPhrase;
            if (endOk) {
              const beforeReset = Math.round((periodEnd - when) / 86400000);
              if (when.getTime() < periodEnd.getTime() - 8 * 3600000) {
                if (beforeReset <= 0) {
                  resetPhrase = "on the billing reset date";
                } else {
                  resetPhrase =
                    beforeReset +
                    " day" +
                    (beforeReset === 1 ? "" : "s") +
                    " before reset";
                }
              } else if (when.getTime() > periodEnd.getTime() + 8 * 3600000) {
                const afterReset = Math.round((when - periodEnd) / 86400000);
                if (afterReset <= 0) {
                  resetPhrase = "around monthly reset";
                } else {
                  resetPhrase =
                    afterReset +
                    " day" +
                    (afterReset === 1 ? "" : "s") +
                    " after reset";
                }
              } else {
                resetPhrase = "around monthly reset";
              }
            } else {
              resetPhrase = "relative to monthly reset";
            }
            return (
              "At this pace you are expected to run out of your allowance by " +
              ord +
              ". (" +
              resetPhrase +
              ")."
            );
          }

          function setPoolPaceBox(el, label, usagePct) {
            const L = "<strong>" + escapeHtml(label) + ":</strong> ";
            if (usagePct == null) {
              el.className = "pie-status pie-status--muted";
              el.hidden = false;
              el.innerHTML = L + "no data for this period.";
              return;
            }
            if (usagePct >= 100) {
              const msg = runoutLine(usagePct) || "over 100% of this pool’s allowance";
              el.className = "pie-status pie-status--red";
              el.hidden = false;
              el.innerHTML = L + escapeHtml(msg);
              return;
            }
            const diff = usagePct - pace;
            if (Math.abs(diff) < 0.4) {
              el.className = "pie-status pie-status--green";
              el.hidden = false;
              el.innerHTML = L + "on the even monthly pace (" + Math.round(usagePct) + "% used).";
              return;
            }
            if (diff < 0) {
              el.className = "pie-status pie-status--green";
              el.hidden = false;
              el.innerHTML = L + Math.round(Math.abs(diff)) + "% under the even monthly pace!";
              return;
            }
            const ro = runoutLine(usagePct);
            el.className = "pie-status pie-status--amber";
            el.hidden = false;
            const tail =
              Math.round(diff) +
              "% over the even monthly pace" +
              (ro ? " - " + ro : "") +
              (ro ? "" : ".");
            el.innerHTML = L + escapeHtml(tail);
          }

          setPoolPaceBox(pieAutoStatus, "Auto + Composer", stats.autoPercent);
          setPoolPaceBox(pieApiStatus, "API pool", stats.apiPercent);
        }

        /** When billing is missing, avoid "Sign in" while `/api/auth/me` succeeded but spending stats are not ready yet. */
        function usageChartEmptyHint(payload) {
          const stats = payload && payload.stats;
          const session = payload && payload.session;
          const signedInSession = !!(session && session.me && session.me.ok);
          const signedInStats = stats && stats.loggedIn === true;
          if (stats && stats.ok === false) {
            return "Could not load usage for this chart.";
          }
          if (stats && stats.loggedIn === false) {
            return "Sign in; stats refresh automatically when this window is open…";
          }
          if (signedInSession || signedInStats) {
            return "Loading usage…";
          }
          return "Sign in; stats refresh automatically when this window is open…";
        }

        /**
         * Chart projection diagnostics. In the dashboard DevTools console run:
         *   localStorage.setItem("cursorStatsChartDebug", "1"); location.reload();
         * Copy lines starting with "[cursor-stats:chart]". Disable with removeItem or "0".
         */
        function chartDebugEnabled() {
          try {
            return localStorage.getItem("cursorStatsChartDebug") === "1";
          } catch (e) {
            return false;
          }
        }
        function chartDebugLog(payload) {
          if (!chartDebugEnabled()) return;
          console.log("[cursor-stats:chart]", payload);
        }

        function drawUsageChart(canvas, payload) {
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          const ct = chartTheme();
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();
          const cw = Math.max(260, Math.floor(rect.width));
          const ch = 100;
          canvas.width = cw * dpr;
          canvas.height = ch * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          ctx.clearRect(0, 0, cw, ch);
          ctx.fillStyle = ct.plotBg;
          ctx.fillRect(0, 0, cw, ch);

          const billing = payload && payload.billing;
          const stats = payload && payload.stats;

          if (!billing) {
            ctx.fillStyle = ct.emptyHint;
            ctx.font = "10px system-ui,sans-serif";
            ctx.fillText(usageChartEmptyHint(payload), 8, 44);
            return;
          }

          const padL = 32;
          const padR = 6;
          const padT = 6;
          const padB = 18;
          const gw = cw - padL - padR;
          const gh = ch - padT - padB;
          const D = Math.max(1, billing.daysTotal);
          const curD = Math.max(0, Math.min(D, billing.currentDayIndex));
          const elapsedDays = billingElapsedDays(billing);

          function xOf(day) {
            return padL + (day / D) * gw;
          }
          function yOf(pct) {
            const v = Math.max(0, Math.min(115, pct));
            return padT + gh - (v / 100) * gh;
          }

          ctx.strokeStyle = ct.grid;
          ctx.lineWidth = 1;
          for (const p of [0, 25, 50, 75, 100]) {
            ctx.beginPath();
            ctx.moveTo(padL, yOf(p));
            ctx.lineTo(padL + gw, yOf(p));
            ctx.stroke();
          }

          ctx.strokeStyle = ct.axis;
          ctx.beginPath();
          ctx.moveTo(padL, padT);
          ctx.lineTo(padL, padT + gh);
          ctx.lineTo(padL + gw, padT + gh);
          ctx.stroke();

          const uAuto = stats && stats.autoPercent != null ? stats.autoPercent : null;
          const uApi = stats && stats.apiPercent != null ? stats.apiPercent : null;

          function xRunoutBandStart(usagePct) {
            if (usagePct == null || !Number.isFinite(Number(usagePct))) return null;
            const u = Number(usagePct);
            const paceAt = (elapsedDays / D) * 100;
            if (u < 100 && u - paceAt < 0.4) return null;
            const rate = u / elapsedDays;
            if (rate < 0.01) return null;
            const d100 = (100 * elapsedDays) / Math.max(u, 1e-9);
            if (!Number.isFinite(d100) || d100 > D) return null;
            return xOf(Math.max(0, Math.min(D, d100)));
          }
          function drawRunoutBand(usagePct, color) {
            const x1 = xRunoutBandStart(usagePct);
            if (x1 == null) return;
            const xR = padL + gw;
            if (x1 < xR) {
              ctx.fillStyle = color;
              ctx.fillRect(x1, padT, xR - x1, gh);
            }
          }
          drawRunoutBand(uAuto, ct.autoOverageBand);
          drawRunoutBand(uApi, ct.apiOverageBand);

          const us = payload && payload.usageSeries;
          const aSeries = us && Array.isArray(us.auto) && us.auto.length ? us.auto : null;
          const pSeries = us && Array.isArray(us.api) && us.api.length ? us.api : null;

          function dailyDeltasFromCumulative(series) {
            if (!series || !series.length) return null;
            const out = [];
            for (let d = 0; d < series.length; d++) {
              const cur = series[d] || 0;
              const prev = d > 0 ? series[d - 1] || 0 : 0;
              out.push(Math.max(0, cur - prev));
            }
            return out;
          }

          const delA = dailyDeltasFromCumulative(aSeries);
          const delP = dailyDeltasFromCumulative(pSeries);
          const hasEventDeltas = (delA && delA.length > 0) || (delP && delP.length > 0);

          const wSlot = gw / D;
          const daysToDraw = Math.min(D, curD + 1);

          function sumArr(a) {
            if (!a || !a.length) return 0;
            var s = 0;
            for (var j = 0; j < a.length; j++) s += a[j] || 0;
            return s;
          }

          function dailyDeltasFromLocalHistory(hist, days) {
            function line(pool) {
              const key = pool === "auto" ? "autoPercent" : "apiPercent";
              const byAt = /** @type {Record<number, { at: string, v: number }>} */ ({});
              const hl = hist && hist.length ? hist.length : 0;
              for (let i = 0; i < hl; i++) {
                const e = hist[i];
                if (!e || typeof e !== "object") continue;
                const di = e.dayIndex;
                if (di < 0 || di >= days) continue;
                const raw = e[key];
                if (raw == null || !Number.isFinite(Number(raw))) continue;
                const at = e.at != null ? String(e.at) : "";
                const v = Number(raw);
                if (!byAt[di] || (at > byAt[di].at)) {
                  byAt[di] = { at, v };
                }
              }
              const cum = new Array(days).fill(0);
              let run = 0;
              for (let d = 0; d < days; d++) {
                if (byAt[d] != null) {
                  run = byAt[d].v;
                }
                cum[d] = run;
              }
              const out = [];
              for (let d = 0; d < days; d++) {
                const cur = cum[d] ?? 0;
                const prev = d > 0 ? cum[d - 1] : 0;
                out.push(Math.max(0, cur - prev));
              }
              return out;
            }
            return { a: line("auto"), p: line("api") };
          }

          const histD = dailyDeltasFromLocalHistory(
            (payload && payload.history) || [],
            daysToDraw,
          );
          const nDays = Math.max(1, daysToDraw);
          const yBottom = yOf(0);
          const PURP = "rgba(124, 58, 237, 0.22)";
          const BLUE = "rgba(37, 99, 235, 0.2)";
          const REL_BAR_FRAC = 0.44;
          const barCapPx = gh * REL_BAR_FRAC;
          const MIN_PX = 4;

          const histA = sumArr(histD.a) > 1e-9;
          const histP = sumArr(histD.p) > 1e-9;
          const eventA = hasEventDeltas && delA && delA.length ? sumArr(delA) : 0;
          const eventP = hasEventDeltas && delP && delP.length ? sumArr(delP) : 0;
          const useEvent =
            (delA && delA.length) || (delP && delP.length) ? (eventA > 1e-6 || eventP > 1e-6) : false;
          const useHistory = !useEvent && (histA || histP);

          const perDay = [];
          for (let d = 0; d < daysToDraw; d++) {
            let da;
            let dp;
            if (useEvent) {
              da = delA && delA[d] != null ? delA[d] : 0;
              dp = delP && delP[d] != null ? delP[d] : 0;
            } else if (useHistory) {
              da = histD.a[d] != null ? histD.a[d] : 0;
              dp = histD.p[d] != null ? histD.p[d] : 0;
            } else {
              da = uAuto != null ? uAuto / nDays : 0;
              dp = uApi != null ? uApi / nDays : 0;
            }
            perDay.push({ da, dp });
          }

          function countDayPositive(a) {
            if (!a || !a.length) return 0;
            var c = 0;
            for (var i2 = 0; i2 < a.length; i2++) {
              if ((a[i2] || 0) > 1e-9) c += 1;
            }
            return c;
          }
          function maxArr(a) {
            if (!a || !a.length) return 0;
            var m = 0;
            for (var i3 = 0; i3 < a.length; i3++) {
              if ((a[i3] || 0) > m) m = a[i3] || 0;
            }
            return m;
          }
          /** Height ∝ (raw / max) so only the heaviest-usage day is full; zero days = no bar. No min–max — that forced identical pixels when raws were even. */
          function heightsByMaxOnly(raw, cap) {
            if (!raw || !raw.length) {
              return raw.map(function () {
                return 0;
              });
            }
            const hi = maxArr(raw);
            if (hi < 1e-12) {
              return raw.map(function () {
                return 0;
              });
            }
            return raw.map(function (v) {
              if ((v || 0) < 1e-12) return 0;
              return MIN_PX + ((v / hi) * (cap - MIN_PX));
            });
          }

          const arrA = perDay.map(function (x) {
            return x.da;
          });
          const arrP = perDay.map(function (x) {
            return x.dp;
          });

          const hA = heightsByMaxOnly(arrA, barCapPx);
          const hP = heightsByMaxOnly(arrP, barCapPx);

          for (let d = 0; d < daysToDraw; d++) {
            const xL = xOf(d);
            const gap = 1;
            const halfW = Math.max(1, (wSlot - gap) / 2);
            const ha = hA[d] || 0;
            const hp = hP[d] || 0;
            if (ha > 0) {
              const t = yBottom - ha;
              ctx.fillStyle = PURP;
              ctx.fillRect(xL + 0.5, t, halfW - 0.5, ha);
            }
            if (hp > 0) {
              const t2 = yBottom - hp;
              ctx.fillStyle = BLUE;
              ctx.fillRect(xL + 0.5 + halfW + gap * 0.5, t2, halfW - 0.5, hp);
            }
          }

          /** Ideal even-use diagonal (neutral) — distinct from blue API projection dashes. */
          ctx.strokeStyle = isDarkMode() ? "rgba(161, 161, 170, 0.45)" : "rgba(113, 113, 122, 0.45)";
          ctx.lineWidth = 1;
          ctx.setLineDash([6, 5]);
          ctx.beginPath();
          ctx.moveTo(xOf(0), yOf(0));
          ctx.lineTo(xOf(D), yOf(100));
          ctx.stroke();
          ctx.setLineDash([]);

          function drawLineFromZero(usagePct, color) {
            if (usagePct == null) return;
            const yEnd = yOf(Math.min(usagePct, 115));
            const x0 = xOf(0);
            const xC = xOf(elapsedDays);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(x0, yOf(0));
            ctx.lineTo(xC, yEnd);
            ctx.stroke();
          }

          /** Step chart: one horizontal segment per day, vertical jump on new usage (cumulative at end of day d). */
          function drawSeriesFromApiStep(series, color) {
            if (!series || !series.length) return;
            const last = Math.min(curD, series.length - 1);
            if (last < 0) return;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(xOf(0), yOf(0));
            for (let d = 0; d <= last; d++) {
              const s = series[d] ?? 0;
              if (!Number.isFinite(s)) continue;
              const yS = yOf(Math.min(s, 115));
              const sM1 = d === 0 ? 0 : series[d - 1] ?? 0;
              const yM1 = yOf(Math.min(sM1, 115));
              const x = xOf(d);
              if (d === 0) {
                ctx.lineTo(x, yS);
              } else {
                ctx.lineTo(x, yM1);
                ctx.lineTo(x, yS);
              }
              if (d < last) {
                ctx.lineTo(xOf(d + 1), yS);
              }
            }
            ctx.stroke();
          }

          if (aSeries) {
            drawSeriesFromApiStep(aSeries, "#7c3aed");
          } else {
            drawLineFromZero(uAuto, "#7c3aed");
          }
          if (pSeries) {
            drawSeriesFromApiStep(pSeries, "#2563eb");
          } else {
            drawLineFromZero(uApi, "#2563eb");
          }

          function cumulativeAtCurD(series, fallback) {
            if (series && series.length) {
              const ix = Math.min(curD, series.length - 1);
              const v = series[ix];
              if (v != null && Number.isFinite(Number(v))) return Number(v);
            }
            return fallback;
          }

          /** Match status boxes + runout bands: headline percents can lead stale usageSeries after refresh. */
          const autoAtCur =
            uAuto != null && Number.isFinite(Number(uAuto))
              ? Number(uAuto)
              : cumulativeAtCurD(aSeries, null);
          const apiAtCur =
            uApi != null && Number.isFinite(Number(uApi))
              ? Number(uApi)
              : cumulativeAtCurD(pSeries, null);

          /**
           * Linear burn extrapolation from average daily rate (same basis as runout copy).
           * Steeper when usage is further above even monthly pace.
           */
          function drawPaceRunoutProjection(pool, usagePct, dashColor) {
            const paceAtFull = (elapsedDays / D) * 100;
            if (usagePct == null || !Number.isFinite(Number(usagePct))) {
              chartDebugLog({
                pool,
                action: "skip",
                reason: "usagePct null or not finite",
                usagePct,
                elapsedDays,
                D,
                curD,
                paceAtPercent: paceAtFull,
              });
              return;
            }
            const uPct = Number(usagePct);
            if (uPct >= 100) {
              chartDebugLog({
                pool,
                action: "skip",
                reason: "usage at or over 100%",
                usagePct: uPct,
                paceAtPercent: paceAtFull,
              });
              return;
            }
            const paceAt = paceAtFull;
            if (uPct - paceAt < 0.4) {
              chartDebugLog({
                pool,
                action: "skip",
                reason: "on or under monthly pace (need usage − pace ≥ 0.4)",
                usagePct: uPct,
                paceAtPercent: paceAt,
                diffFromPace: uPct - paceAt,
              });
              return;
            }
            const rate = uPct / elapsedDays;
            if (rate < 0.01) {
              chartDebugLog({
                pool,
                action: "skip",
                reason: "avg daily rate < 0.01",
                usagePct: uPct,
                rate,
                elapsedDays,
              });
              return;
            }
            const d100 = (100 * elapsedDays) / Math.max(uPct, 1e-9);
            if (!Number.isFinite(d100) || d100 <= elapsedDays) {
              chartDebugLog({
                pool,
                action: "skip",
                reason: "d100 not finite or not after elapsedDays",
                usagePct: uPct,
                d100,
                elapsedDays,
              });
              return;
            }
            const span = d100 - elapsedDays;
            if (span > 420) {
              chartDebugLog({
                pool,
                action: "skip",
                reason: "projection span > 420 days",
                span,
                d100,
                elapsedDays,
              });
              return;
            }
            const x0 = xOf(elapsedDays);
            const y0 = yOf(Math.min(uPct, 100));
            const x1 = xOf(d100);
            const y1 = yOf(100);
            chartDebugLog({
              pool,
              action: "draw",
              usagePct: uPct,
              paceAtPercent: paceAt,
              elapsedDays,
              D,
              curD,
              d100,
              spanDays: span,
              canvasSeg: { x0, y0, x1, y1 },
              dashColor,
            });
            ctx.strokeStyle = dashColor;
            ctx.lineWidth = 1.75;
            ctx.setLineDash([4, 3]);
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          if (chartDebugEnabled()) {
            chartDebugLog({
              action: "drawUsageChart snapshot",
              D,
              curD,
              elapsedDays,
              paceAtPercent: (elapsedDays / D) * 100,
              uAuto,
              uApi,
              autoAtCur,
              apiAtCur,
              aSeriesLen: aSeries ? aSeries.length : null,
              pSeriesLen: pSeries ? pSeries.length : null,
              aSeriesTail: aSeries
                ? aSeries.slice(Math.max(0, aSeries.length - 3))
                : null,
              pSeriesTail: pSeries
                ? pSeries.slice(Math.max(0, pSeries.length - 3))
                : null,
            });
          }

          drawPaceRunoutProjection("auto", autoAtCur, "rgba(124, 58, 237, 0.92)");
          /**
           * API runout: same extrapolation as Auto (purple). Do not draw (curD,0)→(D,100) for zero API —
           * that always meets 100% at period end (x=D) while over-pace Auto can hit 100% only after day D,
           * so the blue line looked earlier / more “alarming” even when API was under pace.
           */
          drawPaceRunoutProjection("api", apiAtCur, "rgba(37, 99, 235, 0.92)");

          ctx.fillStyle = ct.label;
          ctx.font = "8px system-ui,sans-serif";
          ctx.fillText("0%", 2, yOf(0) + 3);
          ctx.fillText("100%", 0, yOf(100) + 3);

          function fmtShort(iso) {
            try {
              const d = new Date(iso + "T12:00:00");
              return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
            } catch {
              return "";
            }
          }

          ctx.fillText(fmtShort(billing.periodStartKey), padL, ch - 4);
          ctx.fillText(fmtShort(billing.periodEndKey), padL + gw - 32, ch - 4);
          ctx.fillText("d" + (curD + 1) + "/" + D, padL + gw / 2 - 12, ch - 4);
        }

        function redrawChart(payload) {
          const p = payload || {};
          drawUsageChart(chartCanvas, p);
          updateChartInsights(p);
        }

        function renderUsage(stats) {
          if (stats && stats.ok === false) {
            if (lastStatsRef && lastStatsRef.ok !== false && lastStatsRef.loggedIn) {
              return;
            }
          }
          lastStatsRef = stats;
          updateHeaderAuth();

          if (!stats) {
            if (chartUsageMeta) chartUsageMeta.innerHTML = "";
            return;
          }

          if (stats.ok === false) {
            setBanner("err", stats.note || "Could not load usage.");
            if (chartUsageMeta) chartUsageMeta.innerHTML = "";
            return;
          }

          if (stats.loggedIn === false) {
            setBanner("warn", stats.note || "Sign in, then open stats again.");
            if (chartUsageMeta) chartUsageMeta.innerHTML = "";
            updateHeaderAuth();
            return;
          }

          if (stats.note) {
            setBanner("warn", stats.note);
          } else {
            setBanner("", "");
          }

          const lines = [];

          if (stats.resetLabel) {
            const rel = stats.resetRelative ? " (" + stats.resetRelative + ")" : "";
            lines.push(
              '<div class="chart-meta-line"><span class="muted">Billing reset</span><span><strong>' +
                escapeHtml(stats.resetLabel) +
                "</strong>" +
                escapeHtml(rel) +
                "</span></div>",
            );
          }

          const apiOnDemand =
            currentSession &&
            currentSession.currentPeriodUsage &&
            currentSession.currentPeriodUsage.ok &&
            currentSession.currentPeriodUsage.amountUsd != null &&
            currentSession.currentPeriodUsage.amountUsd > 0;
          if (stats.onDemand && stats.onDemand.used > 0 && !apiOnDemand) {
            lines.push(
              '<div class="chart-meta-line"><span class="muted">On-demand</span><span><strong>' +
                fmtMoney(stats.onDemand.used) +
                "</strong> / " +
                fmtMoney(stats.onDemand.limit) +
                "</span></div>",
            );
          }

          if (!chartUsageMeta) return;

          if (!lines.length) {
            chartUsageMeta.innerHTML = "";
            if (!stats.note) {
              setBanner("warn", "Could not parse usage.");
            }
            return;
          }

          chartUsageMeta.innerHTML = lines.join("");
        }

        function tokenizeVersion(str) {
          const parts = String(str)
            .split(".")
            .map(function (p) {
              return parseInt(p, 10);
            });
          return parts.some(function (n) {
            return Number.isNaN(n);
          })
            ? [0]
            : parts;
        }

        function compareVer(a, b) {
          const n = Math.max(a.length, b.length);
          for (let i = 0; i < n; i++) {
            const d = (a[i] || 0) - (b[i] || 0);
            if (d !== 0) return d;
          }
          return 0;
        }

        /** Strip invisible chars / normalize whitespace for parsing stable names from scraped docs. */
        function normalizePricingModelName(name) {
          return String(name || "")
            .trim()
            .replace(/[\u200B-\u200D\uFEFF]/g, "")
            .replace(/\s+/g, " ");
        }

        /** Leading product version in the model name (e.g. Claude 4.7 → [4,7]). */
        function extractVersionFromModelName(name) {
          const s = normalizePricingModelName(name);
          let m;
          m = s.match(/^Claude\s+([\d.]+)/i);
          if (m) return tokenizeVersion(m[1]);
          /* Docs sometimes render "Composer2" — allow optional gap before version digits */
          m = s.match(/^Composer\s*([\d.]+(?:\.[\d]+)?)/i);
          if (m) return tokenizeVersion(m[1]);
          m = s.match(/^Gemini\s+([\d.]+(?:\.[\d]+)?)/i);
          if (m) return tokenizeVersion(m[1]);
          m = s.match(/^GPT-([\d.]+(?:\.[\d]+)?)/i);
          if (m) return tokenizeVersion(m[1]);
          m = s.match(/^Grok\s+([\d.]+(?:\.[\d]+)?)/i);
          if (m) return tokenizeVersion(m[1]);
          m = s.match(/^Kimi\s+K([\d.]+(?:\.[\d]+)?)/i);
          if (m) return tokenizeVersion(m[1]);
          return null;
        }

        /** Inferred vendor family from model name (for grouping newest-version highlights). */
        function inferProviderFamilyFromModel(modelName) {
          const s = normalizePricingModelName(modelName);
          if (/^Claude\b/i.test(s)) return "Anthropic";
          if (/^Composer\b/i.test(s)) return "Cursor";
          if (/^GPT-/i.test(s) || /^GPT\b/i.test(s)) return "OpenAI";
          if (/^Gemini\b/i.test(s)) return "Google";
          if (/^Grok\b/i.test(s)) return "xAI";
          if (/^Kimi\b/i.test(s)) return "Moonshot";
          return "other";
        }

        /** Highlight rows whose version equals the max version within each inferred vendor family. */
        function latestRowHighlightsByProvider(models) {
          const byProv = new Map();
          for (let i = 0; i < models.length; i++) {
            const nm = normalizePricingModelName(models[i].model);
            const prov = inferProviderFamilyFromModel(nm);
            const ver = extractVersionFromModelName(nm);
            if (!ver) continue;
            if (!byProv.has(prov)) byProv.set(prov, []);
            byProv.get(prov).push({ i: i, ver: ver });
          }
          const purple = new Set();
          const blue = new Set();
          for (const [prov, entries] of byProv.entries()) {
            if (!entries.length) continue;
            let maxVer = entries[0].ver;
            for (let k = 1; k < entries.length; k++) {
              if (compareVer(entries[k].ver, maxVer) > 0) maxVer = entries[k].ver;
            }
            for (let j = 0; j < entries.length; j++) {
              const { i, ver } = entries[j];
              if (compareVer(ver, maxVer) !== 0) continue;
              /* Purple = Composer/Cursor pool rows — must match inferProviderFamilyFromModel bucket */
              if (prov === "Cursor") purple.add(i);
              else blue.add(i);
            }
          }
          return { purple: purple, blue: blue };
        }

        function pricingNumForSort(v) {
          if (v == null || v === "—") return null;
          const n = Number(v);
          return Number.isFinite(n) ? n : null;
        }

        /** @param {number | null | undefined} v */
        function formatPeriodUsageUsd(v) {
          if (v == null || !Number.isFinite(v)) return "—";
          return (
            "$" +
            v.toLocaleString(undefined, {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2,
            })
          );
        }

        function buildPricingRowList(d, agg) {
          const list = [];
          const auto = d.autoPoolUsdPerMillion;
          if (auto) {
            let usageVal = null;
            if (agg && agg.ok && typeof agg.autoPoolUsd === "number" && Number.isFinite(agg.autoPoolUsd)) {
              usageVal = agg.autoPoolUsd;
            }
            list.push({
              kind: "auto",
              model: "Auto",
              inVal: auto.inputCacheWrite,
              outVal: auto.output,
              modelIndex: null,
              usageVal: usageVal,
            });
          }
          const models = d.models || [];
          for (let i = 0; i < models.length; i++) {
            const m = models[i];
            let usageVal = null;
            if (agg && agg.ok && Array.isArray(agg.modelUsd) && agg.modelUsd[i] != null) {
              const u = agg.modelUsd[i];
              usageVal = typeof u === "number" && Number.isFinite(u) ? u : null;
            }
            list.push({
              kind: "model",
              model: m.model,
              inVal: m.input,
              outVal: m.output,
              modelIndex: i,
              usageVal: usageVal,
            });
          }
          return list;
        }

        function comparePricingRows(a, b, key, dir) {
          let cmp = 0;
          if (key === "model") {
            cmp = String(a.model).localeCompare(String(b.model), undefined, { sensitivity: "base" });
          } else if (key === "in") {
            const na = pricingNumForSort(a.inVal);
            const nb = pricingNumForSort(b.inVal);
            if (na == null && nb == null) cmp = 0;
            else if (na == null) cmp = 1;
            else if (nb == null) cmp = -1;
            else cmp = na - nb;
          } else if (key === "out") {
            const na = pricingNumForSort(a.outVal);
            const nb = pricingNumForSort(b.outVal);
            if (na == null && nb == null) cmp = 0;
            else if (na == null) cmp = 1;
            else if (nb == null) cmp = -1;
            else cmp = na - nb;
          } else if (key === "usage") {
            const na =
              a.usageVal != null && Number.isFinite(a.usageVal)
                ? a.usageVal
                : null;
            const nb =
              b.usageVal != null && Number.isFinite(b.usageVal)
                ? b.usageVal
                : null;
            if (na == null && nb == null) cmp = 0;
            else if (na == null) cmp = 1;
            else if (nb == null) cmp = -1;
            else cmp = na - nb;
          }
          return dir * cmp;
        }

        function isPricingRowHighlighted(row, purple, blue) {
          if (row.kind === "auto") return true;
          if (row.modelIndex == null) return false;
          return purple.has(row.modelIndex) || blue.has(row.modelIndex);
        }

        function compareByModelVersionThenName(a, b) {
          const va = extractVersionFromModelName(a.model);
          const vb = extractVersionFromModelName(b.model);
          if (va == null && vb == null) {
            return String(a.model).localeCompare(String(b.model), undefined, { sensitivity: "base" });
          }
          if (va == null) return 1;
          if (vb == null) return -1;
          const c = compareVer(vb, va);
          if (c !== 0) return c;
          return String(a.model).localeCompare(String(b.model), undefined, { sensitivity: "base" });
        }

        function comparePricingRowsModelNewest(a, b, purple, blue) {
          const ha = isPricingRowHighlighted(a, purple, blue);
          const hb = isPricingRowHighlighted(b, purple, blue);
          if (ha !== hb) return ha ? -1 : 1;
          return compareByModelVersionThenName(a, b);
        }

        function updatePricingSortHeaders() {
          if (!modelsTable) return;
          const ths = modelsTable.querySelectorAll("thead th[data-sort]");
          for (let t = 0; t < ths.length; t++) {
            const th = ths[t];
            const col = th.getAttribute("data-sort");
            th.classList.remove("th-sort--active", "th-sort--asc", "th-sort--desc", "th-sort--newest");
            th.removeAttribute("title");
            if (pricingSortKey && col === pricingSortKey) {
              if (col === "model" && pricingModelCycle === 2) {
                th.classList.add("th-sort--active", "th-sort--newest");
                th.setAttribute("aria-sort", "other");
                th.title = "Newest: highlighted rows first, then by version in the name";
              } else {
                th.classList.add("th-sort--active");
                th.classList.add(pricingSortDir === 1 ? "th-sort--asc" : "th-sort--desc");
                th.setAttribute("aria-sort", pricingSortDir === 1 ? "ascending" : "descending");
              }
            } else {
              th.setAttribute("aria-sort", "none");
            }
          }
        }

        function applyPricingSortColumn(col) {
          if (col === "model") {
            if (pricingSortKey !== "model") {
              pricingSortKey = "model";
              pricingModelCycle = 0;
              pricingSortDir = 1;
            } else {
              pricingModelCycle = (pricingModelCycle + 1) % 3;
              if (pricingModelCycle === 0) pricingSortDir = 1;
              else if (pricingModelCycle === 1) pricingSortDir = -1;
            }
          } else if (col === "in" || col === "out" || col === "usage") {
            pricingModelCycle = 0;
            if (col === pricingSortKey) {
              pricingSortDir *= -1;
            } else {
              pricingSortKey = col;
              pricingSortDir = -1;
            }
          }
          if (lastPricingPayload && lastPricingPayload.ok && lastPricingPayload.data) {
            paintPricingTable(lastPricingPayload.data, lastAggregatedUsage);
          }
        }

        function paintPricingTable(d, agg) {
          if (!modelsTbody) return;
          const models = d.models || [];
          const { purple, blue } = latestRowHighlightsByProvider(models);
          const rows = buildPricingRowList(d, agg);
          if (pricingSortKey) {
            if (pricingSortKey === "model" && pricingModelCycle === 2) {
              rows.sort(function (a, b) {
                return comparePricingRowsModelNewest(a, b, purple, blue);
              });
            } else if (pricingSortKey === "model") {
              rows.sort(function (a, b) {
                return comparePricingRows(a, b, "model", pricingModelCycle === 0 ? 1 : -1);
              });
            } else {
              rows.sort(function (a, b) {
                return comparePricingRows(a, b, pricingSortKey, pricingSortDir);
              });
            }
          }
          modelsTbody.innerHTML = "";
          const aggOk = agg && agg.ok;
          let sumSpendUsd = 0;
          if (aggOk) {
            for (let s = 0; s < rows.length; s++) {
              const u = rows[s].usageVal;
              if (u != null && Number.isFinite(u) && u > 0) sumSpendUsd += u;
            }
          }
          for (let r = 0; r < rows.length; r++) {
            const row = rows[r];
            const tr = document.createElement("tr");
            if (row.kind === "auto") {
              tr.className = "row-latest-purple";
            } else if (row.modelIndex != null) {
              const i = row.modelIndex;
              if (blue.has(i)) tr.className = "row-latest-blue";
              else if (purple.has(i)) tr.className = "row-latest-purple";
            }
            let pctOfTotal = 0;
            if (
              aggOk &&
              sumSpendUsd > 0 &&
              row.usageVal != null &&
              Number.isFinite(row.usageVal) &&
              row.usageVal >= 0
            ) {
              pctOfTotal = Math.min(100, (row.usageVal / sumSpendUsd) * 100);
            }
            if (aggOk && sumSpendUsd > 0 && pctOfTotal > 0.0005) {
              tr.classList.add("pricing-row--meter");
              tr.style.setProperty("--usage-meter-pct", pctOfTotal.toFixed(3) + "%");
              let strong = "var(--usage-meter-neutral-strong)";
              let soft = "transparent";
              if (row.kind === "auto") {
                strong = "var(--usage-meter-purple-strong)";
                soft = "var(--row-latest-purple)";
              } else if (row.modelIndex != null && blue.has(row.modelIndex)) {
                strong = "var(--usage-meter-blue-strong)";
                soft = "var(--row-latest-blue)";
              } else if (row.modelIndex != null && purple.has(row.modelIndex)) {
                strong = "var(--usage-meter-purple-strong)";
                soft = "var(--row-latest-purple)";
              }
              tr.style.setProperty("--usage-meter-strong", strong);
              tr.style.setProperty("--usage-meter-soft", soft);
            }
            tr.innerHTML =
              "<td>" +
              escapeHtml(row.model) +
              '</td><td class="num">' +
              (row.inVal ?? "—") +
              '</td><td class="num">' +
              (row.outVal ?? "—") +
              '</td><td class="num">' +
              formatPeriodUsageUsd(row.usageVal) +
              "</td>";
            modelsTbody.appendChild(tr);
          }
          updatePricingSortHeaders();
        }

        function renderPricing(pr) {
          if (!pricingStatus) return;

          if (!pr || !pr.ok || !pr.data) {
            lastPricingPayload = pr;
            pricingStatus.hidden = false;
            pricingStatus.textContent =
              (pr && pr.error) ||
              "Pricing unavailable. Check the main-process terminal for [model-pricing] logs.";
            if (modelsTbody) modelsTbody.innerHTML = "";
            updatePricingSortHeaders();
            return;
          }

          lastPricingPayload = pr;
          pricingStatus.hidden = true;
          pricingStatus.textContent = "";
          paintPricingTable(pr.data, lastAggregatedUsage);
        }

        if (modelsTable) {
          const sortHead = modelsTable.querySelector("thead");
          if (sortHead) {
            sortHead.addEventListener("click", function (e) {
              const t = e.target;
              const th = t && t.closest ? t.closest("th[data-sort]") : null;
              if (!th || !modelsTable.contains(th)) return;
              e.preventDefault();
              applyPricingSortColumn(th.getAttribute("data-sort"));
            });
            sortHead.addEventListener("keydown", function (e) {
              if (e.key !== "Enter" && e.key !== " ") return;
              const t = e.target;
              const th = t && t.closest ? t.closest("th[data-sort]") : null;
              if (!th || !modelsTable.contains(th)) return;
              e.preventDefault();
              applyPricingSortColumn(th.getAttribute("data-sort"));
            });
          }
        }

        async function loadPricing() {
          const pr = await cw.getPricing();
          renderPricing(pr);
        }

        btnSignin.addEventListener("click", async function () {
          btnSignin.disabled = true;
          try {
            await cw.signIn();
            setBanner("warn", "Complete sign-in in the browser; stats will update when you close that window.");
          } finally {
            btnSignin.disabled = false;
          }
        });

        cw.onStats(function (stats) {
          renderUsage(stats);
        });

        cw.onChart(applyFullDashboard);

        cw.onSession(function (sess) {
          currentSession = sess;
          updateHeaderUserName(sess);
          renderSession(sess, lastStatsRef);
          updateHeaderAuth();
        });

        cw.onLoginClosed(function () {
          setBanner("warn", "Session updated. Pulling latest…");
        });

        linkSpending.addEventListener("click", function (e) {
          e.preventDefault();
          cw.openExternal(SPENDING_URL);
        });
        linkDocs.addEventListener("click", function (e) {
          e.preventDefault();
          cw.openExternal(DOCS_URL);
        });
        linkFontana.addEventListener("click", function (e) {
          e.preventDefault();
          cw.openExternal(FONTANA_URL);
        });

        if (btnTheme) {
          btnTheme.addEventListener("click", function (e) {
            e.preventDefault();
            toggleTheme();
          });
        }
        try {
          window
            .matchMedia("(prefers-color-scheme: dark)")
            .addEventListener("change", function () {
              if (userTheme == null) applyTheme(true);
            });
        } catch (e) {}

        applyTheme(false);

        loadPricing();
        cw.getLastStats().then(function (s) {
          if (s) {
            lastStatsRef = s;
            renderUsage(s);
          } else {
            lastStatsRef = s;
            updateHeaderAuth();
          }
        });
        cw.getSession().then(function (s) {
          if (s != null) {
            currentSession = s;
            renderSession(s, lastStatsRef);
            updateHeaderAuth();
          }
        });
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            cw.getChartData().then(function (chart) {
              if (chart && chart.session != null) currentSession = chart.session;
              applyFullDashboard(chart);
            });
            maybeFetchAppUpdate();
          });
        });

        window.addEventListener("resize", function () {
          cw.getChartData().then(applyFullDashboard);
        });
      })();
    </script>
  </body>
</html>
